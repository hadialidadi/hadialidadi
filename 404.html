<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>۴۰۴ | صفحه پیدا نشد</title>
    <script src="https://bayanbox.ir/download/8895715100116426368/tailwind.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0a0a0a;
            color: #e0e0e0;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Loading Styles */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loader-logo {
            width: 80px;
            margin-bottom: 20px;
            filter: brightness(0) invert(1);
            animation: pulse 2s infinite ease-in-out;
        }

        .loader-ring {
            width: 50px;
            height: 50px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #111111 0%, #050505 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            opacity: 0; /* برای انیمیشن ورود */
            filter: blur(20px); /* افکت محو شونده اولیه */
        }

        .error-code {
            font-size: 120px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 1rem;
            background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.1) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            display: inline-block;
        }

        .error-code::after {
            content: '404';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            -webkit-background-clip: text;
            filter: blur(15px);
            opacity: 0.5;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .btn-home {
            background: #ffffff;
            color: #000000;
            padding: 12px 32px;
            border-radius: 16px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            margin-top: 2rem;
        }

        .btn-home:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255,255,255,0.1);
            background: #f0f0f0;
        }

        .white-logo {
            filter: brightness(0) invert(1);
            opacity: 0.5;
            height: 40px;
            margin-bottom: 2rem;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="preloader">
        <img src="https://bayanbox.ir/download/1390626578137567308/TypeEn2%D8%B52%D8%B3%D8%B4glish.png" alt="لوگو" class="loader-logo">
        <div class="loader-ring"></div>
    </div>

    <!-- 3D Background -->
    <div id="canvas-container"></div>

    <div class="glass-card" id="error-container">
        <!-- لوگوی سایت -->
        <div class="flex justify-center">
            <img src="https://bayanbox.ir/download/1390626578137567308/TypeEn2%D8%B52%D8%B3%D8%B4glish.png" alt="Logo" class="white-logo">
        </div>

        <h1 class="error-code">404</h1>
        
        <h2 class="text-2xl font-bold mb-4 text-white">مسیر رو گم کردی؟</h2>
        
        <p class="text-gray-400 leading-relaxed">
            صفحه‌ای که دنبالش بودی پیدا نشد. نگران نباش، از طریق دکمه زیر می‌تونی به دنیای اصلی برگردی.
        </p>

        <a href="index.html" class="btn-home">
            <i class="fas fa-arrow-right text-sm"></i>
            <span>بازگشت به خانه</span>
        </a>
    </div>

    <!-- Scripts -->
    <script src="https://bayanbox.ir/download/9089153275279504415/three.min.js"></script>
    <script src="https://bayanbox.ir/download/530187406124072977/gsap.min.js"></script>

    <script>
        let scene, camera, renderer, particles;

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const particlesGeometry = new THREE.BufferGeometry();
            const count = 2500;
            const positions = new Float32Array(count * 3);

            for(let i = 0; i < count * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 15;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.018,
                color: 0x888888,
                transparent: true,
                opacity: 0.4
            });

            particles = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particles);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if(particles) {
                particles.rotation.y += 0.0006;
                particles.rotation.x += 0.0003;
            }
            renderer.render(scene, camera);
        }

        window.onload = () => {
            init3D();
            
            const preloader = document.getElementById('preloader');
            const tl = gsap.timeline();

            // انیمیشن خروج لودینگ و ورود محتوا با افکت Blur
            tl.to(".loader-ring", { opacity: 0, duration: 0.3 })
              .to(".loader-logo", { scale: 1.3, opacity: 0, duration: 0.5, ease: "power2.in" })
              .to(preloader, { 
                  yPercent: -100, 
                  duration: 1, 
                  ease: "expo.inOut" 
              })
              .to("#error-container", {
                  duration: 2,
                  opacity: 1,
                  filter: "blur(0px)", // محو شدن بلر
                  scale: 1,
                  y: 0,
                  ease: "expo.out"
              }, "-=0.4");
        };

        window.addEventListener('mousemove', (e) => {
            if (!particles) return;
            const mouseX = (e.clientX / window.innerWidth) - 0.5;
            const mouseY = (e.clientY / window.innerHeight) - 0.5;

            gsap.to(particles.rotation, {
                y: mouseX * 0.4,
                x: -mouseY * 0.4,
                duration: 2,
                ease: "power2.out"
            });

            gsap.to("#error-container", {
                x: mouseX * 25,
                y: mouseY * 25,
                duration: 1.5,
                ease: "power2.out"
            });
        });

        window.addEventListener('resize', () => {
            if(camera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
