<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هادی علیدادی | دیزاینر</title>
    <link rel="icon" href="https://rozup.ir/download/4225779/favicon.gif" type="image/gif">
    <style>
        @font-face {
            font-family: 'Estedad';
            src: url('https://loxup.ir/m/mysite_lxb.ir/cats_image/Estedad-FD-ExtraLight.woff2') format('woff2');
            font-weight: 200;
            font-style: normal;
        }
        @font-face {
            font-family: 'Estedad';
            src: url('https://loxup.ir/m/mysite_lxb.ir/cats_image/Estedad-FD-Light.woff2') format('woff2');
            font-weight: 300;
            font-style: normal;
        }
        @font-face {
            font-family: 'Estedad';
            src: url('https://loxup.ir/m/mysite_lxb.ir/cats_image/Estedad-FD-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Estedad';
            src: url('https://loxup.ir/m/mysite_lxb.ir/cats_image/Estedad-FD-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'Estedad';
            src: url('https://loxup.ir/m/mysite_lxb.ir/cats_image/Estedad-FD-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
        }
        @font-face {
            font-family: 'Estedad';
            src: url('https://loxup.ir/m/mysite_lxb.ir/cats_image/Estedad-FD-ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-style: normal;
        }
        @font-face {
            font-family: 'Estedad';
            src: url('https://loxup.ir/m/mysite_lxb.ir/cats_image/Estedad-FD-Black.woff2') format('woff2');
            font-weight: 900;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Estedad', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #040405;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .ambient-background {
            position: absolute;
            inset: -50px;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.45;
            animation: moveBlobs 12s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 500px;
            height: 500px;
            background: #2a2c30;
            top: 5%;
            left: 10%;
            animation-duration: 10s;
        }

        .blob-2 {
            width: 600px;
            height: 600px;
            background: #18191c;
            bottom: -5%;
            right: 10%;
            animation-duration: 14s;
            animation-delay: -3s;
        }

        .blob-3 {
            width: 420px;
            height: 420px;
            background: #35383d;
            top: 45%;
            left: 35%;
            animation-duration: 9s;
            animation-delay: -5s;
        }

        @keyframes moveBlobs {
            0% {
                transform: translate(0px, 0px) scale(0.95) rotate(0deg);
            }
            50% {
                transform: translate(90px, -60px) scale(1.2) rotate(60deg);
            }
            100% {
                transform: translate(-70px, 80px) scale(1.05) rotate(-45deg);
            }
        }

        .noise-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(4,4,5,0.75) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 680px;
            text-align: center;
            padding: 20px;
        }

        .story-container {
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .message-box {
            font-size: 2.15rem;
            font-weight: 300;
            line-height: 2;
            letter-spacing: -0.5px;
            color: #ffffff;
            opacity: 0;
            transform: translateY(20px);
            filter: blur(10px);
            transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: pre-line;
        }

        .message-box.active {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        .message-box.bold-special {
            font-weight: 800;
            font-size: 2.25rem;
            letter-spacing: -0.8px;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
        }

        .final-container {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            filter: blur(10px);
            transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(18, 19, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 45px 30px;
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        .final-container.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        .brand-logo {
            display: block;
            margin: 0 auto 24px auto;
            max-height: 55px;
            width: auto;
            object-fit: contain;
            filter: brightness(0) invert(1);
            opacity: 0.95;
            transition: transform 0.3s ease;
        }

        .brand-logo:hover {
            transform: scale(1.05);
        }

        .social-text {
            font-size: 1.15rem;
            font-weight: 400;
            color: #d1d1d6;
            margin-bottom: 28px;
            line-height: 1.8;
            letter-spacing: -0.3px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #c5c5cb;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .social-link svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .social-link:hover {
            color: #000000;
            background: #ffffff;
            border-color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.18);
        }

        @media (max-width: 580px) {
            .message-box {
                font-size: 1.6rem;
                line-height: 1.8;
            }
            .message-box.bold-special {
                font-size: 1.7rem;
            }
            .social-text {
                font-size: 1.02rem;
            }
            .final-container {
                padding: 35px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="noise-overlay"></div>

    <div class="main-wrapper">
        <div class="story-container" id="storyContainer" onclick="nextMessage(true)">
            <div class="message-box" id="messageBox"></div>
        </div>

        <div class="final-container" id="finalContainer">
            <img src="https://rozup.ir/download/4225780/TypeEn2%D8%B52%D8%B3%D8%B4glish%20(1).png" alt="Logo" class="brand-logo">

            <p class="social-text">اگه خواستی این مسیر رو ادامه بدیم، از اینجاها هم در ارتباط باش:</p>
            
            <div class="social-icons">
                <a href="#" class="social-link" title="تلگرام">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
                </a>
                <a href="#" class="social-link" title="اینستاگرام">
                    <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                </a>
                <a href="#" class="social-link" title="ایکس">
                    <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </a>
                <a href="#" class="social-link" title="لینکدین">
                    <svg viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                </a>
            </div>
        </div>
    </div>

    <script>
        const messages = [
            { text: "سلام. بالاخره اومدی.", duration: 3800, isBold: false },
            { text: "راستش من تو رو خوب می‌شناسم.\nچون خودِ تو هستم؛ فقط از چند قدم جلوتر.", duration: 4800, isBold: false },
            { text: "الان شاید حس کنی یه چیزی کمه،\nیا یه جایی از مسیر رو اشتباه رفتی.", duration: 4800, isBold: false },
            { text: "ولی اومدم که بگم هنوز دیر نشده.\nقرار نیست معجزه کنم یا شعار بدم.", duration: 4800, isBold: false },
            { text: "فقط می‌خوام کنارت باشم\nتا کم‌کم کیفیتت رو ببری بالا.", duration: 4500, isBold: false },
            { text: "عیارت رو بالاتر ببری،\nبدون اینکه خودت رو گم کنی.", duration: 4500, isBold: false },
            { text: "من در کنار توام که بتونی کیفیتتو بالاتر ببری و عیارتو بالاتر ببری.", duration: 5200, isBold: true },
            { text: "حالا اگه موافقی،\nاز یه قدم کوچیک شروع کنیم.", duration: 4200, isBold: false }
        ];

        let currentIndex = -1;
        let messageTimer = null;
        const msgBox = document.getElementById("messageBox");
        const storyContainer = document.getElementById("storyContainer");
        const finalContainer = document.getElementById("finalContainer");

        function nextMessage(manual = false) {
            clearTimeout(messageTimer);

            if (currentIndex >= messages.length - 1) {
                showFinalScreen();
                return;
            }

            msgBox.classList.remove("active");

            setTimeout(() => {
                currentIndex++;
                const current = messages[currentIndex];
                msgBox.innerText = current.text;

                if (current.isBold) {
                    msgBox.classList.add("bold-special");
                } else {
                    msgBox.classList.remove("bold-special");
                }

                msgBox.classList.add("active");

                messageTimer = setTimeout(() => {
                    if (currentIndex < messages.length - 1) {
                        nextMessage();
                    } else {
                        showFinalScreen();
                    }
                }, current.duration);

            }, manual ? 250 : 550);
        }

        function showFinalScreen() {
            clearTimeout(messageTimer);

            msgBox.classList.remove("active");

            setTimeout(() => {
                storyContainer.style.display = "none";
                finalContainer.classList.add("show");
            }, 600);
        }

        window.addEventListener("load", () => {
            setTimeout(() => {
                nextMessage();
            }, 1000);
        });
    </script>
</body>
</html>
